name: ai_chef
description: AI-powered recipe finder application using Clean Architecture and Riverpod
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Supabase
  supabase_flutter: ^2.3.4

  # Firebase
  firebase_core: ^2.10.0
  firebase_auth: ^4.2.0
  cloud_firestore: ^4.5.0
  firebase_storage: ^11.0.0

  # Image Handling
  image_picker: ^1.2.2
  cached_network_image: ^3.3.1

  # UI & Responsiveness
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0

  # Networking
  dio: ^5.4.0
  http: ^1.2.0
  google_generative_ai: ^0.4.4

  # JSON Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Utilities
  path_provider: ^2.1.5
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.3.3
  crypto: ^3.0.3

  # Local Storage
  shared_preferences: ^2.5.5
  hive_flutter: ^1.1.0

  # Internet Connectivity
  connectivity_plus: ^7.1.1

  # URL Launcher
  url_launcher: ^6.3.2

  # Native share sheet
  share_plus: ^10.1.4

  # Animations
  shimmer: ^3.0.0

  # Image Processing
  image: ^4.1.3

  # Advanced Animations
  flutter_animate: ^4.5.0

  # Environment Configuration
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  # Temporarily disabled due to analyzer compatibility issues
  # riverpod_generator: ^2.3.9
  # riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/Ingredia_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/Ingredia_logo.png"
